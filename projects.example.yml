# Project registry — each entry defines a project to review.
#
# review_profile composes a prompt from:
#   roles:     domain expertise (backend, frontend, data_engineer, devops, security)
#   languages: language-specific rules (python, typescript, go, sql, shell)
#   custom:    org/team-specific rules loaded from prompts/custom/
#
# model can be overridden per-project (falls back to global default in env).

defaults:
  model: gpt-4o
  git_provider: gitlab

projects:
  # --- Example entries (uncomment and adapt) ---

  # payments-api:
  #   project_id: team/payments-api
  #   gitlab_url: https://gitlab.company.com
  #   repo_path: /repos/payments-api
  #   review_profile:
  #     roles: [backend, security]
  #     languages: [python, sql]
  #   ignore_paths: ["*.lock", "alembic/versions/"]

  # checkout-ui:
  #   project_id: team/checkout-ui
  #   gitlab_url: https://gitlab.company.com
  #   repo_path: /repos/checkout-ui
  #   review_profile:
  #     roles: [frontend]
  #     languages: [typescript]
  #   model: claude-sonnet-4-20250514

  # data-pipeline:
  #   project_id: team/data-pipeline
  #   gitlab_url: https://gitlab.company.com
  #   repo_path: /repos/data-pipeline
  #   review_profile:
  #     roles: [data_engineer, devops]
  #     languages: [python, sql, shell]

  some-repo:
    project_id: gitlab-project-space/some-repo
    gitlab_url: https://gitlab.com
    review_profile:
      roles: [backend]
      languages: [python]
    issues:
      enabled: true
      label: minions
    services:
      api:
        project_id: gitlab-project-space/some-repo
        git_provider: gitlab
        gitlab_url: https://gitlab.com
        clone_url: git@gitlab.com:gitlab-project-space/some-repo.git
        ci_type: gitlab_ci
        deploy_target: none
        language: python
        test_command: pytest
        lint_command: ruff check .
        default_branch: main
        # Checks this repo's RELEASE depends on that must be in the branch's
        # required set before an agent may merge. Opt-in; omit it and nothing
        # changes.
        #
        # This catches a repo that declares a release rule in CI and never
        # arms it -- advisory for agent and human alike. flashback-cns gates
        # releases on `version-bump` but left it unrequired, so an agent PR
        # with no bump merged past a red check; the code landed, the manifests
        # did not move, and the CD that actually deploys shipped nothing.
        #
        # Fails CLOSED, so listing a check the ruleset does not require will
        # block agent merges on that repo until someone arms it. That is the
        # intent -- but arm the check first, or PRs will pile up.
        expected_required_checks: [version-bump]
