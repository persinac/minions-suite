[project]
name = "minion-suite"
version = "0.1.0"
description = "AI agent suite — composable, vendor-agnostic agents starting with code review"
requires-python = ">=3.14"
dependencies = [
    "litellm>=1.50.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "fastmcp>=2.0,<3",
    "aiosqlite>=0.20.0",
    "psycopg[binary,pool]>=3.1",
    "nats-py>=2.12,<2.13",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-gitlab>=4.0.0",
    "rich>=13.0",
    "boto3>=1.35.0",
    "kubernetes-asyncio>=31.0.0",
    "langgraph>=1.1",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langfuse>=4.0.0",
    "agent-memory",
    "redis[hiredis]>=5.0",
    "prometheus-client>=0.20",
    "dynaconf>=3.2",
]

[tool.uv.sources]
agent-memory = { path = "agent-memory", editable = true }

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
minion = "minions.cli:main"

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.uv]
python-preference = "managed"

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM108", # ternary operator (project convention: no ternaries)
    "SIM102", # nested if (prefer explicit over combined conditions)
    "SIM103", # return condition directly (prefer explicit if/return)
    "SIM105", # contextlib.suppress (prefer explicit try/except)
    "SIM110", # any() (prefer explicit for-loop)
    "RUF005", # list concatenation (prefer + over unpacking)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["minions"]
