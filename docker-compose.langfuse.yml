# Langfuse self-hosted stack — compose overlay.
#
# Pure service overlay: it adds the langfuse services and patches nothing, so it
# layers cleanly onto either base.
#
# Containerised app:   docker compose -f docker-compose.yml -f docker-compose.langfuse.yml up -d
# Native app:          task up LANGFUSE=true      (base is docker-compose.dev.yml)
#
# Then set in your .env:
#   LANGFUSE_PUBLIC_KEY=<create in Langfuse UI at http://localhost:3000>
#   LANGFUSE_SECRET_KEY=<create in Langfuse UI>
#   LANGFUSE_OTEL_HOST=<see below — differs by path>
#
# LANGFUSE_OTEL_HOST depends on where the app runs, because the hostname has to
# resolve from the app's own network namespace:
#   containerised app -> http://langfuse:3000     (compose network DNS)
#   native app        -> http://localhost:3000    (published port)
#
# This used to be set for you by a `minion-suite: {environment: ...}` stanza at
# the bottom of this file. That stanza forced the compose project to contain a
# minion-suite service, which broke `task up` (native app, infra-only base) with
# "service minion-suite has neither an image nor a build context". It also only
# ever emitted the container value, which is wrong for the native path.

services:

  langfuse:
    image: langfuse/langfuse:3
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: mysecretkey
      SALT: mysalt
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6380"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
      langfuse-redis:
        condition: service_healthy
    restart: unless-stopped

  langfuse-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse-pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse-chdata:/var/lib/clickhouse
    ports:
      - "8123:8123"

  langfuse-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - langfuse-minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  langfuse-minio-create-bucket:
    image: minio/mc
    depends_on:
      - langfuse-minio
    entrypoint: >
      /bin/sh -c "
        mc alias set minio http://langfuse-minio:9000 minioadmin minioadmin;
        mc mb minio/langfuse --ignore-existing;
        exit 0;
      "

  langfuse-redis:
    image: redis:7
    command: ["redis-server", "--port", "6380"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse-redis:/data
    ports:
      - "6380:6380"

volumes:
  langfuse-pgdata:
  langfuse-chdata:
  langfuse-minio:
  langfuse-redis:
