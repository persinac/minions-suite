version: '3'

dotenv: ['.env.local', '.env']

vars:
  # Secrets runner. ONE definition, inherited by every included taskfile.
  #
  # It used to be declared separately in minion.yaml, e2e.yaml and memory.yaml,
  # which is how it drifted: 59ea3c2 changed minion.yaml's default from
  # `doppler run --` to empty and left the comment claiming otherwise, so for
  # months `task minion:server` ran on whatever was exported or sitting in .env
  # while the docs, the comment and preflight's own WARN all described a doppler
  # run that was not happening.
  #
  # --project is HARDCODED and the config override is deliberately NOT named
  # DOPPLER_CONFIG. The Doppler CLI reads DOPPLER_PROJECT/DOPPLER_CONFIG from the
  # environment, and this box already exports nexus/prd for an unrelated agent --
  # so `${DOPPLER_CONFIG:-dev}` would silently resolve to prd on someone else's
  # project. Explicit flags beat ambient env in the CLI's precedence; deriving
  # the flags FROM that env throws the protection away.
  #
  # Swap providers:  SECRETS_CMD="./scripts/aws-sm-run minion/prod --" task minion:server
  # No wrapper:      SECRETS_CMD="" task minion:server
  # Other config:    MINION_DOPPLER_CONFIG=prd task minion:server
  #
  # `${SECRETS_CMD-...}`, NOT `${SECRETS_CMD:-...}`. The colon form substitutes
  # on empty as well as unset, so `SECRETS_CMD=""` -- the documented way to opt
  # out -- would still get wrapped in doppler. That was harmless while the
  # default was empty and stops being harmless the moment it is not.
  SECRETS_CMD:
    sh: echo "${SECRETS_CMD-doppler run --project mcp-minions --config ${MINION_DOPPLER_CONFIG:-dev} --}"

includes:
  minion:
    taskfile: tasks/minion.yaml
  docker:
    taskfile: tasks/docker.yaml
  db:
    taskfile: tasks/db.yaml
  memory:
    taskfile: tasks/memory.yaml
  e2e:
    taskfile: tasks/e2e.yaml
  herder:
    taskfile: tasks/herder.yaml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # =============================================================================
  # Setup
  # =============================================================================

  setup:uv-all:
    desc: Pin Python version, regenerate lock file, and sync all packages
    cmds:
      - uv python pin 3.14
      - uv lock
      - uv sync --dev --extra test

  setup:init:
    desc: First-time setup — install Python, sync deps, run preflight
    cmds:
      - uv python install 3.14
      - uv python pin 3.14
      - uv sync --dev --extra test
      - uv run python -m minions --preflight

  # =============================================================================
  # Formatting
  # =============================================================================

  fmt:
    desc: Format and fix lint issues
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  test:
    desc: Run unit tests (both suites)
    cmds:
      # Two invocations, not one testpaths entry. Both directories are named
      # `tests` and both have a conftest.py, which collides in pytest's plugin
      # manager regardless of --import-mode. Running them separately is the
      # boring fix that actually works.
      #
      # agent-memory was excluded from the default run entirely, which is why the
      # memory tier shipped broken twice — a SyntaxError, then a create_index
      # TypeError — each caught by cli.py and downgraded to "continuing without it".
      - uv run pytest {{.CLI_ARGS}}
      - uv run pytest agent-memory/tests {{.CLI_ARGS}}

  lint:
    desc: Check formatting and lint without modifying files
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .

  # =============================================================================
  # Full Stack — one-stop-shop
  # =============================================================================

  up:
    desc: "Spin up EVERYTHING — infra, DB, migrations, dashboard, server"
    vars:
      LANGFUSE: '{{.LANGFUSE | default "false"}}'
      # docker-compose.dev.yml is the committed baseline, so a fresh clone works.
      # docker-compose.local.yml is gitignored and optional — layered on top only
      # if you have one, so personal overrides never become tree dirt.
      COMPOSE_FILES:
        sh: |
          FILES="-f docker-compose.dev.yml"
          if [ -f docker-compose.local.yml ]; then
            FILES="$FILES -f docker-compose.local.yml"
          fi
          if [ "{{.LANGFUSE}}" = "true" ]; then
            FILES="$FILES -f docker-compose.langfuse.yml"
          fi
          echo "$FILES"
    cmds:
      # 1. Start infra containers
      - echo "==> Starting infrastructure (postgres, redis, nats{{if eq .LANGFUSE "true"}}, langfuse{{end}})..."
      - docker compose {{.COMPOSE_FILES}} up -d

      # 2. Wait for Postgres to be healthy
      - echo "==> Waiting for Postgres..."
      - |
        for i in $(seq 1 30); do
          if docker compose {{.COMPOSE_FILES}} exec -T postgres pg_isready -U minion -d minion > /dev/null 2>&1; then
            break
          fi
          sleep 1
        done

      # 3. Wait for Redis to be healthy
      - echo "==> Waiting for Redis..."
      - |
        for i in $(seq 1 20); do
          if docker compose {{.COMPOSE_FILES}} exec -T redis redis-cli ping > /dev/null 2>&1; then
            break
          fi
          sleep 1
        done

      # 4. Init infra (DB role + NATS stream) — idempotent
      - echo "==> Running init-infra (DB roles, NATS streams)..."
      - scripts/init-infra.sh --postgres-url "postgresql://minion:minion@localhost:5434/minion" --nats-url "nats://localhost:4222" --app-user minion_app --app-password localdev --skip-nats

      # 5. Run DB migrations
      - echo "==> Running database migrations..."
      - task db:migrate

      # 6. Start dashboard (background)
      - echo "==> Starting dashboard on http://localhost:8322 ..."
      - uv run python -m minions --dashboard &

      # 7. Start input source pollers (background)
      - echo "==> Starting input source pollers..."
      - uv run python -m minions --pollers &

      # 8. Print status
      - |
        echo ""
        echo "============================================"
        echo "  Minions Suite — EVERYTHING IS UP"
        echo "============================================"
        echo "  Postgres   : localhost:5434"
        echo "  Redis      : localhost:6379"
        echo "  NATS       : localhost:4222 (monitor :8222)"
        echo "  Dashboard  : http://localhost:8322"
        echo "  Memory     : http://localhost:8322/memory"
        echo "  Metrics    : http://localhost:8322/metrics"
        echo "  Pollers    : gitlab-issues, trello (if configured)"
        {{if eq .LANGFUSE "true"}}echo "  Langfuse   : http://localhost:3000"{{end}}
        echo ""
        echo "  Starting MCP server on :8321 ..."
        echo "============================================"
        echo ""

      # 9. Start the MCP server (foreground — Ctrl+C stops everything)
      - uv run python -m minions --server

  down:
    desc: "Stop everything — containers + background processes"
    vars:
      # Mirror `up`'s layering, plus langfuse unconditionally: `down` should stop
      # whatever is running regardless of how it was started.
      COMPOSE_FILES:
        sh: |
          FILES="-f docker-compose.dev.yml"
          if [ -f docker-compose.local.yml ]; then
            FILES="$FILES -f docker-compose.local.yml"
          fi
          echo "$FILES -f docker-compose.langfuse.yml"
    cmds:
      - docker compose {{.COMPOSE_FILES}} down 2>/dev/null || true
      - echo "Infrastructure stopped."
