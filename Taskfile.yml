version: '3'

dotenv: ['.env']

includes:
  minion:
    taskfile: tasks/minion.yaml
  docker:
    taskfile: tasks/docker.yaml
  db:
    taskfile: tasks/db.yaml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # =============================================================================
  # Setup
  # =============================================================================

  setup:uv-all:
    desc: Pin Python version, regenerate lock file, and sync all packages
    cmds:
      - uv python pin 3.14
      - uv lock
      - uv sync --dev --extra test

  setup:init:
    desc: First-time setup — install Python, sync deps, run preflight
    cmds:
      - uv python install 3.14
      - uv python pin 3.14
      - uv sync --dev --extra test
      - uv run python -m minions --preflight

  # =============================================================================
  # Formatting
  # =============================================================================

  fmt:
    desc: Format and fix lint issues
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  test:
    desc: Run unit tests
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  lint:
    desc: Check formatting and lint without modifying files
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
