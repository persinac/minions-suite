apiVersion: apps/v1
kind: Deployment
metadata:
  name: minion-dashboard
  labels:
    app.kubernetes.io/name: minion-dashboard
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minion-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minion-dashboard
        app.kubernetes.io/component: ui
      annotations:
        # This Prometheus is the Helm chart with kubernetes_sd_configs, not the
        # operator — there are no ServiceMonitor/PodMonitor CRDs in the cluster,
        # so discovery is by pod annotation and this is how the target appears.
        #
        # Scraped from the DASHBOARD, not the engine: these gauges are read from
        # the database rather than accumulated in memory, and the engine serves
        # no HTTP at all (only the MCP SSE surface). See dashboard.py's
        # Prometheus section for why DB-backed rather than in-process counters.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8322"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ecr-creds
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Skip the recursive chown of every mounted volume unless the volume
        # root's ownership is actually wrong. See minion-suite/deployment.yaml.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minion-dashboard
          image: minion-suite
          # The dashboard is a SEPARATE uvicorn process — `--server` does not
          # serve it. cli.py:927 calls run_dashboard() with no argument, so the
          # port is hardcoded to 8322 in dashboard.py:1467 with no env override.
          # The image declares CMD, not ENTRYPOINT, so a bare `args:` would
          # REPLACE the whole command and k8s would try to exec "--dashboard" as a
          # binary. Give the interpreter explicitly, matching the fleet house
          # style (flashback-cns uses `command: [".venv/bin/python", ...]`).
          command: ["/app/.venv/bin/python", "-m", "minions"]
          args: ["--dashboard"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          ports:
            - name: http
              containerPort: 8322
          envFrom:
            - secretRef: {name: minion-suite-config}
            - secretRef: {name: minion-suite-db}
            - secretRef: {name: minion-suite-redis}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: "/tmp"
            - name: ENV_FOR_DYNACONF
              value: "production"
            # Read-only viewer. It queries Postgres directly and runs no engine;
            # set explicitly so it can never become a third dispatcher.
            - name: ENGINE_ENABLED
              value: "false"
          # /healthz touches nothing. Do NOT probe the DB-backed routes:
          # dashboard handlers swallow exceptions and return empty JSON, so they
          # report healthy with Postgres down — a probe against them proves
          # nothing.
          #
          # These pointed at /metrics until that route became DB-backed. Probing
          # it now would make LIVENESS depend on Postgres, so a slow query on a
          # cold metrics cache would restart a pod whose only problem was a busy
          # database. /healthz exists to keep the probe honest and cheap.
          readinessProbe:
            httpGet: {path: /healthz, port: 8322}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8322}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {memory: "256Mi", cpu: "50m"}
            limits: {memory: "512Mi", cpu: "500m"}
      restartPolicy: Always
