# Project registry for the flashback-fleet deployment.
#
# Mounted over /app/projects.yaml by the ConfigMap, replacing the copy baked into
# the image (which targets a GitLab project over SSH and is the local-dev config).
#
# GENERATED from the live GitHub App installation — every entry's language and
# default_branch comes from the GitHub API, not from a guess. Regenerate rather
# than hand-editing when the installation changes; five of these repos use
# `master` rather than `main`, which is the kind of detail hand-maintenance loses.
#
# ── Deliberate choices ──
#
# model: claude-opus-5. There is no OPENAI_API_KEY in Doppler mcp-minions/prd —
# only ANTHROPIC_API_KEY and MOONSHOT_API_KEY — so the repo-root file's gpt-4o
# default fails on the first agent call.
#
# clone_url is HTTPS, not SSH. Nothing mounts an SSH key into these pods, and
# authentication is the GitHub App installation token, which is a bearer token.
#
# auto_merge: true everywhere. Once the code reviewer approves, minions squash-
# merges and deletes the branch with no human in the loop.
#
# The merge runs as the ENGINEER App, not the reviewer. Merging writes to the
# base branch and --delete-branch removes a ref, so it needs `Contents: read and
# write`, which only the engineer holds; the reviewer App is deliberately
# read-only on Contents because its only job is to approve. `Pull requests: read
# and write` alone is NOT sufficient to merge. GitHub permits an identity to
# merge a PR it opened — it only forbids it *approving* one.
#
# The reviewer's verdict is therefore the only gate. Nothing here consults
# branch protection; if a repo needs a human approval or green CI before merge,
# configure that on the GitHub side, because minions will not stop itself.
#
# ── Known gap ──
#
# Repos in C, C++, Kotlin, Swift, TypeScript and Go are registered but not yet
# workable end to end: the image ships Python plus git/gh/rg/aws only, with no
# node, go, gradle or ESP toolchain. Agents can read and edit those repos but
# cannot run their tests, so test_command is deliberately omitted rather than
# set to something that would fail confusingly.

defaults:
  # NO `model:` here, deliberately.
  #
  # A project model is passed to resolve_model at exactly ONE call site — the
  # reviewer fan-out (engine/dev.py) — and it returns before either the reviewer
  # default or the difficulty tier is consulted. So `model: claude-opus-5` here
  # did not mean "this project prefers Opus"; it meant "every reviewer is Opus,
  # always", silently overriding model_reviewer=claude-sonnet-5 AND the
  # classifier.
  #
  # Job 33c89d9b is what that cost: classified EASY, engineer on the herder at
  # $0.00, and still $4.76 of Opus reviewers out of a $4.81 total.
  #
  # Removing it lets the intended resolution apply: model_reviewer (Sonnet 5)
  # for medium and hard, and the easy tier for easy tickets. Set `model:` on an
  # INDIVIDUAL project only when that project genuinely needs its reviewers
  # pinned, and know that it overrides everything when you do.
  git_provider: github

