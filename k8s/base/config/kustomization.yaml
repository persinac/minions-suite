apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: minion-suite-config-files
    files:
      - projects.yaml

generatorOptions:
  # Fixed name, no content hash. Both Deployments reference this ConfigMap by
  # name; a hashed name would work too, but ArgoCD prunes the superseded
  # ConfigMap as soon as it syncs, and any pod that has not yet rolled loses its
  # mount. Stable name means a projects.yaml edit is picked up on next restart
  # instead of racing the rollout.
  disableNameSuffixHash: true
