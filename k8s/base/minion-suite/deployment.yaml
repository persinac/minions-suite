apiVersion: apps/v1
kind: Deployment
metadata:
  name: minion-suite
  labels:
    app.kubernetes.io/name: minion-suite
    app.kubernetes.io/component: orchestration
spec:
  replicas: 1
  strategy:
    # The job engine holds job leases and does startup reconciliation; two copies
    # racing on the same Postgres would double-dispatch. Never run two at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minion-suite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minion-suite
        app.kubernetes.io/component: orchestration
      annotations:
        # sha256 of k8s/base/config/projects.yaml. Nothing reads this value —
        # it exists so that editing projects.yaml changes the pod template and
        # ArgoCD rolls the pods.
        #
        # Without it a projects.yaml-only commit is invisible to the cluster:
        # the ConfigMap keeps a stable name (see config/kustomization.yaml for
        # why), the mount uses subPath so the kubelet never refreshes the file,
        # and build_registry reads it once at startup. ArgoCD reports Synced
        # while the engine routes on whatever the file said when the pod last
        # started. 8b22888 split pinball-db into its ETL and its site and sat
        # unapplied for twelve days exactly this way.
        #
        # Kept in sync by scripts/sync-config-checksum.sh and enforced by
        # tests/test_projects_yaml.py::TestConfigChecksum.
        minion-suite/projects-checksum: "65c89ff072322132774149f0579c1c7e89d67570a58670678e36395b52507c80"
    spec:
      # The engine drains in-flight in-process agents on SIGTERM
      # (shutdown_grace_seconds, default 300s) rather than failing them
      # instantly. This MUST exceed that, or the kubelet SIGKILLs mid-drain and
      # the wait buys nothing — the default of 30s did exactly that.
      #
      # The cost is that a rollout landing mid-job takes up to this long. That
      # is the intended trade: an agent fifteen minutes and a couple of dollars
      # into a run is worth more than a fast image bump.
      terminationGracePeriodSeconds: 360
      imagePullSecrets:
        - name: ecr-creds
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Without this the kubelet recursively chowns EVERY file on the /repos
        # PVC on every single mount. That volume holds git checkouts for 33
        # repos, so the pod sat in Init:0/2 behind
        # VolumePermissionChangeInProgress for minutes — and it gets worse as
        # more repos are cloned, turning a routine rollout into an outage that
        # scales with usage. OnRootMismatch chowns only when the volume root's
        # ownership is already wrong, which after the first mount it never is.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Mandatory, not defensive. `--server` runs preflight and, on failure,
        # RETURNS — exiting 0 (cli.py:272-274). The pod reports Completed rather
        # than Error, so exit-code alerting never fires and the restart looks clean.
        # Gate on the dependencies instead of relying on the restart loop.
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$POSTGRES_URL" -t 5; do
                echo "waiting for postgres..."; sleep 3
              done
          envFrom:
            - secretRef: {name: minion-suite-db}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {memory: "32Mi", cpu: "10m"}
            limits: {memory: "64Mi", cpu: "100m"}
        # `--server` connects to NATS at startup when nats_enabled; an unreachable
        # server raises NoServersError out of the startup path.
        - name: wait-for-nats
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # NATS_SERVER_IP may be a bare host ("18.191.42.210"), host:port,
              # or scheme-prefixed. Mirrors connectors/nats_config.py
              # _normalize_server, which defaults the port to 4222 when absent.
              #
              # Do NOT parse this with `sed 's#.*:##'`: with no colon present that
              # is a no-op, and stripping non-digits then turns 18.191.42.210 into
              # the port "1819142210" — non-empty, so a ${port:-4222} default never
              # fires and the probe spins forever on a bad port.
              addr=${NATS_SERVER_IP#nats://}; addr=${addr#tls://}; addr=${addr%%/*}
              case "$addr" in
                *:*) host=${addr%:*}; port=${addr##*:} ;;
                *)   host=$addr;      port=4222 ;;
              esac
              until nc -z -w 5 "$host" "$port"; do
                echo "waiting for nats at $host:$port..."; sleep 3
              done
          envFrom:
            - secretRef: {name: minion-suite-config}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {memory: "16Mi", cpu: "10m"}
            limits: {memory: "32Mi", cpu: "100m"}
      containers:
        - name: minion-suite
          image: minion-suite
          # The image declares CMD, not ENTRYPOINT, so a bare `args:` would
          # REPLACE the whole command and k8s would try to exec "--server" as a
          # binary. Give the interpreter explicitly, matching the fleet house
          # style (flashback-cns uses `command: [".venv/bin/python", ...]`).
          command: ["/app/.venv/bin/python", "-m", "minions"]
          args: ["--server"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          ports:
            - name: mcp
              containerPort: 8321
          envFrom:
            # Doppler mcp-minions/prd -> AWS SM -> ESO
            - secretRef: {name: minion-suite-config}
            # POSTGRES_URL, composed by Pulumi from the DO-generated password
            - secretRef: {name: minion-suite-db}
            # REDIS_URL + REDIS_PASSWORD for the in-cluster Redis Stack.
            # MUST come after minion-suite-config: that secret still carries the
            # managed-Redis REDIS_PASSWORD from Doppler, and later envFrom entries
            # win. Without this entry REDIS_URL is unset and config.py:318 falls
            # back to redis://localhost:6379 — which is what preflight reported.
            - secretRef: {name: minion-suite-redis}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # runAsUser 1000 has no homedir; git and gh both write under $HOME
            - name: HOME
              value: "/tmp"
            - name: ENV_FOR_DYNACONF
              value: "production"
            - name: MCP_HOST
              value: "0.0.0.0"
            # Raised from the built-in 60 on 2026-08-21.
            #
            # Exhausting the turn budget is SILENT: the loop is
            # `while num_turns < max_turns`, and falling out of it leaves the
            # agent row status=done with error=NULL — byte-identical to a clean
            # finish. The task then fails with a generic "All dev tasks failed"
            # that names nothing.
            #
            # Job 3b8b8ba9 lost both engineers that way, each at exactly 60
            # turns. The wind-down did land the code on a branch; it just ran out
            # before report_pr, so the work was stranded and re-done from scratch.
            # Across all history 10 of 68 backend_engineer runs hit the ceiling
            # and only 6 of 11 ceiling-hitters ever produced a PR.
            #
            # 100 clears the observed distribution (mean 27, max 69) with room.
            # This is NOT the spend guard — agent_cost_limit_usd (8.0) is, and it
            # is unchanged, so a looping agent is still bounded by money rather
            # than by turns.
            - name: AGENT_MAX_TURNS
              value: "100"
          # There is no health endpoint anywhere in the codebase. `--server` serves
          # only the MCP SSE surface, and probing GET /sse would open a long-lived
          # event stream per probe that the kubelet then abandons. TCP instead.
          startupProbe:
            tcpSocket: {port: 8321}
            periodSeconds: 5
            failureThreshold: 60      # preflight re-runs live provider checks; be generous
          readinessProbe:
            tcpSocket: {port: 8321}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8321}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: repos
              mountPath: /repos
            # settings.toml is baked into the image; only projects.yaml is
            # mounted, since which repos the minions work on changes far more
            # often than app behaviour and should not need a rebuild.
            - name: config
              mountPath: /app/projects.yaml
              subPath: projects.yaml
              readOnly: true
          resources:
            requests: {memory: "1Gi", cpu: "500m"}
            # 4Gi was not enough to hold an agent AND the test suite it shells
            # out to run. In-process agents execute inside THIS container: the
            # engine holds the whole conversation in memory (one engineer
            # reached 1.3M input tokens) and then the agent runs the target
            # repo's tests as a subprocess — management-api is 1367 tests.
            #
            # Every failed run died at the same subtask, "run pytest to verify
            # no regressions", with the code changes already written. The
            # container went down, the pod entered Completed (exit 0, so no
            # OOMKilled event and no restart to find), and the ReplicaSet
            # replaced it — which read as mysterious pod churn for hours.
            #
            # The node has 62Gi allocatable at 12% requested, so this is
            # headroom that already exists. It scales with the largest test
            # suite an agent may run, not with minions itself.
            limits: {memory: "12Gi", cpu: "3"}
      volumes:
        # In-process agents check out repos under repo_base_dir (/repos,
        # config.py:242). Phase 2 K8s dispatch clones into a per-Job emptyDir
        # instead, at which point this can shrink or go away.
        - name: repos
          # Node-local, NOT the Longhorn PVC it used to be.
          #
          # /repos holds disposable git checkouts — everything in it is
          # re-clonable from origin in seconds, so replicated block storage buys
          # nothing and cost a great deal. Under sustained agent I/O (cloning,
          # editing, running a 1367-test suite) the Longhorn replica repeatedly
          # faulted:
          #
          #   Warning AutoSalvaged / Faulted  volume pvc-ce189790...
          #   Warning FailedStartingSnapshotPurge
          #
          # Each fault made the volume briefly unavailable, the mount failed,
          # and the kubelet SIGTERMed the pod — pid 1, ppid 0, clean exit 0, so
          # the pod showed Completed with restarts=0 and every crash-shaped
          # diagnostic came back healthy. Identical fingerprint to the ArgoCD
          # selfHeal loop fixed separately, which is why fixing that one did not
          # stop the churn: there were two independent causes.
          #
          # It only bit while a job ran because an idle pod barely touches the
          # volume. The pod would sit healthy for hours, then die 5-21 minutes
          # into every job.
          #
          # The PVC minion-suite-repos is deliberately left in place, unused, so
          # this is revertible without re-provisioning.
          emptyDir:
            sizeLimit: 20Gi
        - name: config
          configMap:
            name: minion-suite-config-files
      restartPolicy: Always
