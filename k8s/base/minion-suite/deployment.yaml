apiVersion: apps/v1
kind: Deployment
metadata:
  name: minion-suite
  labels:
    app.kubernetes.io/name: minion-suite
    app.kubernetes.io/component: orchestration
spec:
  replicas: 1
  strategy:
    # The job engine holds job leases and does startup reconciliation; two copies
    # racing on the same Postgres would double-dispatch. Never run two at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minion-suite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minion-suite
        app.kubernetes.io/component: orchestration
    spec:
      imagePullSecrets:
        - name: ecr-creds
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Mandatory, not defensive. `--server` runs preflight and, on failure,
        # RETURNS — exiting 0 (cli.py:272-274). The pod reports Completed rather
        # than Error, so exit-code alerting never fires and the restart looks clean.
        # Gate on the dependencies instead of relying on the restart loop.
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$POSTGRES_URL" -t 5; do
                echo "waiting for postgres..."; sleep 3
              done
          envFrom:
            - secretRef: {name: minion-suite-db}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {memory: "32Mi", cpu: "10m"}
            limits: {memory: "64Mi", cpu: "100m"}
        # `--server` connects to NATS at startup when nats_enabled; an unreachable
        # server raises NoServersError out of the startup path.
        - name: wait-for-nats
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # NATS_SERVER_IP may be a bare host ("18.191.42.210"), host:port,
              # or scheme-prefixed. Mirrors connectors/nats_config.py
              # _normalize_server, which defaults the port to 4222 when absent.
              #
              # Do NOT parse this with `sed 's#.*:##'`: with no colon present that
              # is a no-op, and stripping non-digits then turns 18.191.42.210 into
              # the port "1819142210" — non-empty, so a ${port:-4222} default never
              # fires and the probe spins forever on a bad port.
              addr=${NATS_SERVER_IP#nats://}; addr=${addr#tls://}; addr=${addr%%/*}
              case "$addr" in
                *:*) host=${addr%:*}; port=${addr##*:} ;;
                *)   host=$addr;      port=4222 ;;
              esac
              until nc -z -w 5 "$host" "$port"; do
                echo "waiting for nats at $host:$port..."; sleep 3
              done
          envFrom:
            - secretRef: {name: minion-suite-config}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {memory: "16Mi", cpu: "10m"}
            limits: {memory: "32Mi", cpu: "100m"}
      containers:
        - name: minion-suite
          image: minion-suite
          # The image declares CMD, not ENTRYPOINT, so a bare `args:` would
          # REPLACE the whole command and k8s would try to exec "--server" as a
          # binary. Give the interpreter explicitly, matching the fleet house
          # style (flashback-cns uses `command: [".venv/bin/python", ...]`).
          command: ["/app/.venv/bin/python", "-m", "minions"]
          args: ["--server"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          ports:
            - name: mcp
              containerPort: 8321
          envFrom:
            # Doppler mcp-minions/prd -> AWS SM -> ESO
            - secretRef: {name: minion-suite-config}
            # POSTGRES_URL, composed by Pulumi from the DO-generated password
            - secretRef: {name: minion-suite-db}
            # REDIS_URL + REDIS_PASSWORD for the in-cluster Redis Stack.
            # MUST come after minion-suite-config: that secret still carries the
            # managed-Redis REDIS_PASSWORD from Doppler, and later envFrom entries
            # win. Without this entry REDIS_URL is unset and config.py:318 falls
            # back to redis://localhost:6379 — which is what preflight reported.
            - secretRef: {name: minion-suite-redis}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # runAsUser 1000 has no homedir; git and gh both write under $HOME
            - name: HOME
              value: "/tmp"
            - name: ENV_FOR_DYNACONF
              value: "production"
            - name: MCP_HOST
              value: "0.0.0.0"
          # There is no health endpoint anywhere in the codebase. `--server` serves
          # only the MCP SSE surface, and probing GET /sse would open a long-lived
          # event stream per probe that the kubelet then abandons. TCP instead.
          startupProbe:
            tcpSocket: {port: 8321}
            periodSeconds: 5
            failureThreshold: 60      # preflight re-runs live provider checks; be generous
          readinessProbe:
            tcpSocket: {port: 8321}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8321}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: repos
              mountPath: /repos
            # settings.toml is baked into the image; only projects.yaml is
            # mounted, since which repos the minions work on changes far more
            # often than app behaviour and should not need a rebuild.
            - name: config
              mountPath: /app/projects.yaml
              subPath: projects.yaml
              readOnly: true
          resources:
            requests: {memory: "1Gi", cpu: "500m"}
            limits: {memory: "4Gi", cpu: "2"}
      volumes:
        # In-process agents check out repos under repo_base_dir (/repos,
        # config.py:242). Phase 2 K8s dispatch clones into a per-Job emptyDir
        # instead, at which point this can shrink or go away.
        - name: repos
          persistentVolumeClaim:
            claimName: minion-suite-repos
        - name: config
          configMap:
            name: minion-suite-config-files
      restartPolicy: Always
