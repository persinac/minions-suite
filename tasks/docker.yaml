version: '3'

tasks:
  build:
    desc: Build the minion-suite Docker image
    cmds:
      - docker build -t minion-suite:dev .

  rebuild:
    desc: Clean build — prune cache and build from scratch
    cmds:
      - docker builder prune -af
      - docker build --no-cache -t minion-suite:dev .

  ecr:push:
    desc: "Login to ECR and push full + slim images  [AWS_ACCOUNT=..., AWS_REGION=..., ECR_FULL=..., ECR_SLIM=...]"
    deps: [build]
    vars:
      AWS_ACCOUNT: '{{.AWS_ACCOUNT | default "059039070213"}}'
      AWS_REGION: '{{.AWS_REGION | default "us-east-1"}}'
      ECR_FULL: '{{.ECR_FULL | default "mcp-minions-mcpm-cackalacky"}}'
      ECR_SLIM: '{{.ECR_SLIM | default "mcp-minions-mcpm-cackalacky-slim"}}'
      REGISTRY: "{{.AWS_ACCOUNT}}.dkr.ecr.{{.AWS_REGION}}.amazonaws.com"
    cmds:
      - aws ecr get-login-password --region {{.AWS_REGION}} --profile {{.AWS_PROFILE | default "sandbox"}} | docker login --username AWS --password-stdin {{.REGISTRY}}
      - docker tag minion-suite:dev {{.REGISTRY}}/{{.ECR_FULL}}:latest
      - docker push {{.REGISTRY}}/{{.ECR_FULL}}:latest
      - docker tag minion-suite:dev {{.REGISTRY}}/{{.ECR_SLIM}}:latest
      - docker push {{.REGISTRY}}/{{.ECR_SLIM}}:latest

  up:
    desc: Start minion-suite container (detached)
    deps: [build]
    cmds:
      - docker compose up -d --force-recreate --no-build

  down:
    desc: Stop and remove containers
    cmds:
      - docker compose down

  logs:
    desc: Tail container logs
    cmds:
      - docker compose logs -f

  shell:
    desc: Open a shell in the running container
    cmds:
      - docker compose exec minion-suite bash
