version: '3'

tasks:
  build:
    desc: Build the minion-suite Docker image
    cmds:
      - docker build -t minion-suite:dev .

  rebuild:
    desc: Clean build — prune cache and build from scratch
    cmds:
      - docker builder prune -af
      - docker build --no-cache -t minion-suite:dev .

  ecr:push:
    desc: "Login to ECR and push full + slim images  [AWS_ACCOUNT=..., AWS_REGION=..., ECR_FULL=..., ECR_SLIM=...]"
    deps: [build]
    vars:
      AWS_ACCOUNT: '{{.AWS_ACCOUNT | default "059039070213"}}'
      AWS_REGION: '{{.AWS_REGION | default "us-east-1"}}'
      ECR_FULL: '{{.ECR_FULL | default "mcp-minions-mcpm-cackalacky"}}'
      ECR_SLIM: '{{.ECR_SLIM | default "mcp-minions-mcpm-cackalacky-slim"}}'
      REGISTRY: "{{.AWS_ACCOUNT}}.dkr.ecr.{{.AWS_REGION}}.amazonaws.com"
    cmds:
      - aws ecr get-login-password --region {{.AWS_REGION}} --profile {{.AWS_PROFILE | default "sandbox"}} | docker login --username AWS --password-stdin {{.REGISTRY}}
      - docker tag minion-suite:dev {{.REGISTRY}}/{{.ECR_FULL}}:latest
      - docker push {{.REGISTRY}}/{{.ECR_FULL}}:latest
      - docker tag minion-suite:dev {{.REGISTRY}}/{{.ECR_SLIM}}:latest
      - docker push {{.REGISTRY}}/{{.ECR_SLIM}}:latest

  up:
    desc: Start minion-suite container (detached)
    deps: [build]
    cmds:
      - docker compose up -d --force-recreate --no-build

  down:
    desc: Stop and remove containers
    cmds:
      - docker compose down

  logs:
    desc: Tail container logs
    cmds:
      - docker compose logs -f

  shell:
    desc: Open a shell in the running container
    cmds:
      - docker compose exec minion-suite bash

  # ── Local stack (app + postgres + nats + dashboard) ─────────────────────────
  local:up:
    desc: Build and start full local stack (app + dashboard + postgres + nats)
    cmds:
      - docker compose -f docker-compose.local.yml up -d --build

  local:down:
    desc: Stop local Postgres + NATS
    cmds:
      - docker compose -f docker-compose.local.yml down

  local:logs:
    desc: Tail local Postgres + NATS logs
    cmds:
      - docker compose -f docker-compose.local.yml logs -f

  local:reset:
    desc: Destroy local volumes, restart fresh, and run migrations
    cmds:
      - docker compose -f docker-compose.local.yml down -v
      - docker compose -f docker-compose.local.yml up -d --build
      - echo "Waiting for Postgres to be healthy..."
      - until docker compose -f docker-compose.local.yml exec postgres pg_isready -U minion -d minion > /dev/null 2>&1; do sleep 1; done
      - task db:migrate

  local:init:
    desc: Initialize local DB schema and NATS stream
    cmds:
      - scripts/init-infra.sh --postgres-url "postgresql://minion:minion@localhost:5434/minion" --nats-url "nats://localhost:4222" --app-user minion_app --app-password localdev --skip-nats
