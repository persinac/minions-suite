version: '3'

vars:
  # Infra-only base for the `local:*` family, layered exactly like `task up`:
  # committed baseline first, your gitignored overrides on top if you have them.
  #
  # These tasks used to pass `-f docker-compose.local.yml` alone. That file is
  # gitignored, so every one of them failed on a fresh clone — including
  # `local:reset`, which QUICKSTART named as the way to start the project.
  DEV_COMPOSE_FILES:
    sh: |
      FILES="-f docker-compose.dev.yml"
      if [ -f docker-compose.local.yml ]; then
        FILES="$FILES -f docker-compose.local.yml"
      fi
      echo "$FILES"

tasks:
  build:
    desc: Build the minion-suite Docker image
    cmds:
      - docker build -t minion-suite:dev .

  rebuild:
    desc: Clean build — prune cache and build from scratch
    cmds:
      - docker builder prune -af
      - docker build --no-cache -t minion-suite:dev .

  ecr:push:
    desc: "Build, tag from VERSION, and push to the flashback-fleet ECR  [VERSION=..., AWS_ACCOUNT=..., AWS_REGION=...]"
    deps: [build]
    vars:
      # The flashback-fleet account — the one the cluster's `ecr-creds` pull
      # secret is scoped to. Previously pointed at the sandbox account
      # (059039070213) with profile `sandbox`, whose images the cluster cannot
      # pull; the repository there belongs to the separate mcp-minions repo.
      AWS_ACCOUNT: '{{.AWS_ACCOUNT | default "162756281464"}}'
      AWS_REGION: '{{.AWS_REGION | default "us-east-1"}}'
      AWS_PROFILE: '{{.AWS_PROFILE | default "flashback-fleet"}}'
      ECR_REPO: '{{.ECR_REPO | default "minion-suite"}}'
      # Read from the VERSION file so the pushed tag and the tag the prod overlay
      # references can never disagree. scripts/ci-update-manifests.sh writes the
      # same value into the kustomization.
      VERSION:
        sh: cat VERSION | tr -d '[:space:]'
      REGISTRY: "{{.AWS_ACCOUNT}}.dkr.ecr.{{.AWS_REGION}}.amazonaws.com"
    cmds:
      - aws ecr get-login-password --region {{.AWS_REGION}} --profile {{.AWS_PROFILE}} | docker login --username AWS --password-stdin {{.REGISTRY}}
      - docker tag minion-suite:dev {{.REGISTRY}}/{{.ECR_REPO}}:{{.VERSION}}
      - docker push {{.REGISTRY}}/{{.ECR_REPO}}:{{.VERSION}}
      # `latest` is a convenience pointer only. The overlay pins an immutable
      # X.Y.Z tag — never `latest` — so a rollback is a manifest change rather
      # than a re-push, and two pods of the same Deployment cannot end up on
      # different code.
      - docker tag minion-suite:dev {{.REGISTRY}}/{{.ECR_REPO}}:latest
      - docker push {{.REGISTRY}}/{{.ECR_REPO}}:latest
      - echo "pushed {{.REGISTRY}}/{{.ECR_REPO}}:{{.VERSION}}"

  schema:check:
    desc: "Fail if the deployed database is behind this checkout's migrations"
    cmds:
      - uv run python scripts/check_deployed_schema.py

  schema:list:
    desc: "Show local vs deployed migration versions"
    cmds:
      - uv run python scripts/check_deployed_schema.py --list

  release:
    desc: "Check schema, bump VERSION, build+push, and rewrite the prod overlay tag"
    cmds:
      # Schema FIRST, before anything is built or pushed. 0.8.31 shipped code
      # writing jobs.original_spec while the deployed database had no such
      # column -- the migration had only been applied to the local test
      # container -- and every new development job then died at the spec_ready
      # transition, silently, for forty minutes.
      #
      # Nothing caught it because nothing looked. This task builds, pushes and
      # bumps the overlay without ever touching the database, and the deploy
      # verification that did run confirmed the new CODE was live in the pod --
      # true, and a different question from whether the SCHEMA it depends on
      # was.
      #
      # SKIP_SCHEMA_GATE=1 for a release that genuinely does not depend on the
      # pending migrations. Deliberately explicit: the failure mode being
      # prevented is nobody asking, so the override has to be someone asking.
      - |
        if [ "${SKIP_SCHEMA_GATE:-0}" = "1" ]; then
          echo "SKIP_SCHEMA_GATE=1 — not checking the deployed schema."
        else
          uv run python scripts/check_deployed_schema.py
        fi
      # Mirrors the flashback-cns CI flow: bump-version.sh -> build+push ->
      # ci-update-manifests.sh -> commit. The commit is left to you (or CI) so
      # this stays safe to run locally.
      - ./scripts/bump-version.sh
      - task: ecr:push
      - ./scripts/ci-update-manifests.sh "$(cat VERSION | tr -d '[:space:]')"
      - |
        echo ""
        echo "VERSION and the prod overlay now read $(cat VERSION | tr -d '[:space:]')."
        echo "Commit VERSION + k8s/ and push; ArgoCD picks it up on its next poll."

  up:
    desc: Start minion-suite container (detached)
    deps: [build]
    cmds:
      - docker compose up -d --force-recreate --no-build

  down:
    desc: Stop and remove containers
    cmds:
      - docker compose down

  logs:
    desc: Tail container logs
    cmds:
      - docker compose logs -f

  shell:
    desc: Open a shell in the running container
    cmds:
      - docker compose exec minion-suite bash

  # ── Local infra (postgres + redis + nats), app runs natively ────────────────
  #
  # Same containers `task up` starts, minus the native app processes. Use these
  # when you want the infra up but intend to run the app yourself (debugger,
  # `task minion:server`, a test run). For the fully containerised app, use the
  # `docker:up` family above.
  local:up:
    desc: Start local infra (postgres + redis + nats); app runs natively
    cmds:
      - docker compose {{.DEV_COMPOSE_FILES}} up -d

  local:down:
    desc: Stop local infra
    cmds:
      - docker compose {{.DEV_COMPOSE_FILES}} down

  local:logs:
    desc: Tail local infra logs
    cmds:
      - docker compose {{.DEV_COMPOSE_FILES}} logs -f

  local:reset:
    desc: Destroy local infra volumes, restart fresh, and run migrations
    cmds:
      # The one thing `task up` deliberately will not do: throw away your data.
      - docker compose {{.DEV_COMPOSE_FILES}} down -v
      - docker compose {{.DEV_COMPOSE_FILES}} up -d
      - echo "Waiting for Postgres to be healthy..."
      - until docker compose {{.DEV_COMPOSE_FILES}} exec -T postgres pg_isready -U minion -d minion > /dev/null 2>&1; do sleep 1; done
      - task db:migrate

  local:init:
    desc: Initialize local DB schema and NATS stream
    cmds:
      - scripts/init-infra.sh --postgres-url "postgresql://minion:minion@localhost:5434/minion" --nats-url "nats://localhost:4222" --app-user minion_app --app-password localdev --skip-nats
