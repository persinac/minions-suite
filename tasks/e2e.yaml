version: '3'

# HEADS UP ON WHICH DATABASE THESE WRITE TO.
#
# `Config.from_env()` resolves postgres_url from settings.toml, which points at the
# deployed DigitalOcean instance -- NOT at the local dev container. So `task e2e:probe`
# and `task e2e:live` write job rows to the real database unless you say otherwise:
#
#   POSTGRES_URL=postgresql://minion:minion@localhost:5434/minion task e2e:probe -- missing-bound
#
# The local container needs the schema first (`DATABASE_URL=<local> database/dbmate.sh
# pgsql up`), and note that dbmate leaves an untracked ./db/schema.sql behind.
#
# probe is read-mostly -- it writes a job, a task and an agent row and touches no repo.
# live runs engineers, which check out and push to whatever projects.yaml names. Point
# that at a throwaway repo before running it.

vars:
  # SECRETS_CMD comes from the root Taskfile.
  TICKETS: tests/e2e/tickets

tasks:
  hermetic:
    desc: Run the deterministic e2e suite (no network, no tokens)
    cmds:
      - uv run pytest tests/e2e -q

  tickets:
    desc: List the ambiguous tickets available for a live run
    cmds:
      - 'ls -1 {{.TICKETS}}/*.md | sed "s|{{.TICKETS}}/||;s|\.md$||" | grep -v README'

  probe:
    desc: "Watch real agents reason about one ambiguous ticket. No repo needed. Usage: task e2e:probe -- missing-bound"
    cmds:
      - |
        TICKET="{{.CLI_ARGS}}"
        if [ -z "$TICKET" ]; then
          echo "Usage: task e2e:probe -- <ticket>   (see: task e2e:tickets)" >&2
          exit 2
        fi
        {{.SECRETS_CMD}} uv run python scripts/e2e_probe.py $TICKET

  live:
    desc: "Run one ambiguous ticket end-to-end against real models. Usage: task e2e:live -- missing-bound"
    cmds:
      - |
        TICKET="{{.CLI_ARGS}}"
        if [ -z "$TICKET" ]; then
          echo "Usage: task e2e:live -- <ticket>   (see: task e2e:tickets)" >&2
          exit 2
        fi
        FILE="{{.TICKETS}}/${TICKET}.md"
        if [ ! -f "$FILE" ]; then
          echo "No such ticket: $FILE" >&2
          exit 2
        fi
        echo "Running $FILE against real models — this costs tokens and opens real PRs."
        {{.SECRETS_CMD}} uv run python -m minions job "$FILE"

  grade:
    desc: "Grade a live run's assumptions. Usage: task e2e:grade [-- JOB_ID] (default: most recent)"
    cmds:
      - "{{.SECRETS_CMD}} uv run python scripts/e2e_grade.py {{.CLI_ARGS}}"

  live-and-grade:
    desc: "Run a ticket then grade it. Usage: task e2e:live-and-grade -- missing-bound"
    cmds:
      - task: live
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}
      - task: grade
