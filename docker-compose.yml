services:

  minion-suite:
    build: .
    image: minion-suite:dev
    env_file: .env
    ports:
      - "${MCP_PORT:-8321}:8321"
    volumes:
      - ./settings.toml:/app/settings.toml:ro
      - ./projects.yaml:/app/projects.yaml:ro
      - ./projects.local.yaml:/app/projects.local.yaml:ro
      - ./prompts:/app/prompts:ro
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The Dockerfile has always EXPOSEd 8322 and `task up` has always started a
  # dashboard, but the containerised stack had no process serving one — so
  # QUICKSTART's "Dashboard | http://localhost:8322" row was unreachable via
  # `task docker:up`. Same shape as input-sources: same image, different command.
  dashboard:
    build: .
    image: minion-suite:dev
    command: ["python", "-m", "minions", "--dashboard"]
    env_file: .env
    ports:
      - "${DASHBOARD_PORT:-8322}:8322"
    volumes:
      - ./settings.toml:/app/settings.toml:ro
      - ./projects.yaml:/app/projects.yaml:ro
      - ./projects.local.yaml:/app/projects.local.yaml:ro
      - ./prompts:/app/prompts:ro
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  input-sources:
    build: .
    image: minion-suite:dev
    command: ["python", "-m", "minions", "--pollers"]
    env_file: .env
    volumes:
      - ./settings.toml:/app/settings.toml:ro
      - ./projects.yaml:/app/projects.yaml:ro
      - ./projects.local.yaml:/app/projects.local.yaml:ro
      - ./prompts:/app/prompts:ro
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # pgvector, not apache/age. Migration 20260314120000_add_memory_extensions.sql
  # runs `CREATE EXTENSION vector` (memory_nodes.embedding is vector(1536)) and
  # that same migration dropped AGE on 2026-07-25 — no runtime code path uses it
  # and the managed target cannot offer it. Keep this in step with
  # docker-compose.dev.yml, which the tests also point at.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: minion
      POSTGRES_PASSWORD: minion
      POSTGRES_DB: minion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minion -d minion"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"

  nats:
    image: nats:latest
    command: ["-js", "--store_dir=/data"]
    volumes:
      - natsdata:/data
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring endpoint

volumes:
  pgdata:
  natsdata:
  redisdata:
  logs:
