# Minions Suite — Configuration Settings
# Secrets (API keys, tokens, passwords) belong in .env, not here.
# Override any value locally via settings.local.toml (gitignored).
# Override per-environment via [development] or [production] sections.

[default]
# Routed by LiteLLM to Anthropic and present in its cost map, so per-agent
# spend still lands in the dashboard and cost reports. Per-role selection
# (cheaper models for the deploy monitor and spec analyst) is a separate
# change; this is the global fallback every agent uses today.
model = "claude-opus-5"
log_level = "INFO"
projects_file = "projects.yaml"
dry_run = false

[default.server]
mcp_port = 8321
mcp_host = "localhost"
mcp_connect_host = "localhost"
repo_base_dir = "/repos"

[default.engine]
# Exactly one process should run a JobEngine. Both --server and --pollers build
# one, and job advancement has no cross-process lock — two engines will each
# dispatch agents for the same job. Set ENGINE_ENABLED=false on poller-only
# deployments; the pollers just write jobs to the DB and need no engine.
enabled = true
poll_interval = 10
job_poll_interval = 5
max_concurrent_reviews = 3
# One job at a time. Concurrency here multiplies spend directly: each job runs a
# spec analyst, an arbiter, one or more engineers and a reviewer, and the $25
# per-job ceiling is per job — three concurrent jobs is a $75 ceiling.
# Raise deliberately, once a full job has been observed end to end under the
# ceilings.
max_concurrent_jobs = 1
max_revisions = 3

# --- Spend ceilings (USD; 0 disables) ---------------------------------------
# Nothing bounded cost before these existed. The agent loop stopped on turns or
# wall-clock only, with max_turns hardcoded at 100 — one backend_engineer run
# billed $20.57 by turn 64, with headroom for roughly half as much again.
#
# agent_cost_limit_usd feeds the existing wind-down escalation, so an agent at
# 80% of budget is told to wrap up and at 90% is restricted to commit/push/PR
# tools. It ships what it has instead of being killed mid-edit.
#
# job_cost_limit_usd is checked before each agent launches and is what actually
# bounds a job — the per-agent limit alone would let one job spend N times over
# by running N agents.
agent_cost_limit_usd = 8.0
job_cost_limit_usd = 25.0
# Raised from 60 after measuring four runs of the same ticket: the engineer
# consistently spent its whole turn budget on the file edits and died before
# "create branch, commit, push, open PR" — the three steps that produce the
# deliverable.
#
#   19cbee54  $2.71  2.00M tokens  died before git
#   67f250f4  $4.45  2.79M tokens  died before git
#   dbc956ff  $0.93  2.65M tokens  died before git
#
# Crucially dbc956ff spent $0.93 against an $8 per-agent ceiling: it did not run
# out of MONEY, it ran out of TURNS. Raising this costs nothing on a job that
# finishes early and buys the git sequence room on one that does not. Spend is
# still bounded by agent_cost_limit_usd and job_cost_limit_usd, which are the
# real controls — max_turns only exists to stop a cheap agent looping forever.
agent_max_turns = 120

# --- Job admission rate caps ------------------------------------------------
# The cost ceilings bound what one job spends; these bound how many jobs get to
# spend at all — the difference between one bad job and a bad afternoon. Set
# high on purpose: a backstop against a runaway intake loop, not a quota.
# Over-cap jobs are deferred at spec_received, not failed, so they start on
# their own once the window clears.
max_jobs_per_hour = 20
max_jobs_per_month = 500

# --- Difficulty-based model tiers -------------------------------------------
# One cheap Haiku call scores the four RICE factors per job; difficulty =
# effort / confidence picks the tier, and every agent on that job uses it.
# Reach x Impact >= 15 floors an otherwise-easy ticket at medium, so a one-line
# billing change never runs on the cheapest model.
#
# Routing deliberately does NOT use the classic (R*I*C)/E priority score: that
# ranks value, not difficulty, and would send a typo fix (0.5) to the most
# expensive model precisely because it is trivial and low-impact.
#
# Fail-open: an unclassifiable spec leaves difficulty unset and uses `model`.
classifier_enabled = true
classifier_model = "claude-haiku-4-5"
classifier_max_chars = 6000
model_easy = "claude-haiku-4-5"
model_medium = "claude-sonnet-5"
model_hard = "claude-opus-5"
agent_timeout = 600
agent_log_dir = "logs/agents"
agent_dispatch_mode = "in_process"

[default.database]
pool_min = 2
pool_max = 10

[default.nats]
enabled = false
stream = "minions"

[default.arbiter]
enabled = false

[default.pollers.gitlab_issues]
enabled = false
poll_interval = 120

[default.pollers.trello]
poll_interval = 180

[default.pollers.renovate]
enabled = false
poll_interval = 60
max_concurrent = 2

[default.memory]
enabled = false
l3_token_budget = 2000
log_level = "INFO"

[default.langfuse]
host = "https://cloud.langfuse.com"

[default.langgraph]
use_agent = true
use_engine = true

[default.k8s]
dispatch = false
namespace = "minion-suite"
agent_image = ""
agent_sa = "minion-suite-agent"
job_ttl = 3600
secrets_name = "minion-suite-secrets"

[default.artifacts]
bucket = ""
region = "us-east-1"
prefix = "minions"

[default.git]
provider = "gitlab"
gitlab_url = ""

[default.aws]
profile = "mcp-minions"

# ── Per-environment overrides ────────────────────────────────────────────────
# Activate with ENV_FOR_DYNACONF=development (or production)

[development]
log_level = "DEBUG"

[development.nats]
enabled = true

[development.arbiter]
enabled = true

[development.memory]
enabled = true
log_level = "DEBUG"

[development.pollers.gitlab_issues]
enabled = true

# --- production (K8s / flashback-fleet) ---------------------------------------
# Activate with ENV_FOR_DYNACONF=production. Without this block, production
# silently inherits [default], where nats/arbiter/memory are all false.

[production]
log_level = "INFO"

[production.server]
# Must bind 0.0.0.0 in a container — the [default] value of "localhost" would
# make the MCP port unreachable from outside the pod.
mcp_host = "0.0.0.0"

[production.nats]
enabled = true

[production.arbiter]
enabled = true

[production.memory]
enabled = true

[production.git]
provider = "github"

# NOTE: the Trello poller has no `enabled` flag — cli.py:590 starts it whenever
# TRELLO_API_KEY + TRELLO_TOKEN + TRELLO_BOARD_ID are all present. Those live in
# Doppler mcp-minions/prd, so it activates automatically in this environment.

[production.pollers.trello]
# One job admitted from the queue per 8 hours. Agent tokens dominate the bill —
# an engineer alone hit $8.18 on job 095146b8 — so how often a job may START is
# the only reliable cap on total spend. Also leaves a window to push prompt or
# config changes between runs rather than mid-flight.
#
# Separate from poll_interval on purpose: the same loop monitors running jobs
# and moves their cards, so throttling the poll itself would strand finished
# cards in "In progress" for 8 hours.
min_job_interval = 28800

[production.pollers.gitlab_issues]
enabled = false

[production.k8s]
# Phase 1 runs agents in-process. K8s Job dispatch stays off until the
# agent-worker is given a tool executor — dispatched agents currently return
# {"error": "No tool executor configured"} for every tool call.
dispatch = false
